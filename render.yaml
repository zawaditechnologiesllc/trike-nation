# Render Blueprint — deploys the Go Cart Grip API.
# The storefront is NOT deployed here: it runs on Cloudflare Workers
# (see frontend/wrangler.jsonc and .github/workflows/deploy.yml).
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: gocartgrip-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      # Set the secret values in the Render dashboard after the first deploy.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: "Go Cart Grip <orders@gocartgrip.shop>"
      - key: EMAIL_REPLY_TO
        value: support@gocartgrip.shop
      - key: ADMIN_EMAIL
        value: admin@gocartgrip.shop
      - key: SUPPORT_EMAIL
        value: support@gocartgrip.shop
      - key: BRAND_NAME
        value: Go Cart Grip
      - key: BRAND_DOMAIN
        value: gocartgrip.shop
      # Stripe runs without webhooks — payments are confirmed by an admin, so
      # there is no signing secret to configure.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_CURRENCY
        value: usd
      # Must match the secret set on the gocartgrip-cron Cloudflare Worker.
      - key: CRON_SECRET
        sync: false
      - key: DELIVERY_UPDATE_DAYS
        value: 7,12,20
      - key: DELIVERY_MIN_DAYS
        value: "12"
      - key: DELIVERY_MAX_DAYS
        value: "30"
      # The Cloudflare Worker owns the schedule; leave this off.
      - key: ENABLE_INTERNAL_CRON
        value: "false"
      - key: IMAGE_CACHE_SECONDS
        value: "31536000"
      - key: FRONTEND_URL
        value: https://gocartgrip.shop
      - key: CORS_ORIGIN
        value: https://gocartgrip.shop,https://www.gocartgrip.shop
