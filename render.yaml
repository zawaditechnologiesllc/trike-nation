# Render Blueprint — deploys the Go Cart Grip API.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: gocartgrip-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      # Set the secret values in the Render dashboard after the first deploy.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: "Go Cart Grip <orders@gocartgrip.shop>"
      - key: ADMIN_EMAIL
        value: support@gocartgrip.shop
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_ENV
        value: live
      - key: FRONTEND_URL
        sync: false # your Vercel URL, e.g. https://gocartgrip.vercel.app
      - key: CORS_ORIGIN
        sync: false # same as FRONTEND_URL (comma-separate to allow more)
